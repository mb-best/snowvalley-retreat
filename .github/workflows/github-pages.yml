name: Publish complete Snowvalley game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen map, models and gameplay rules
        run: |
          node scripts/check-yunxiu-world.mjs
          node scripts/check-yunxiu-life.mjs
      - name: Prepare complete portable site
        run: |
          node scripts/migration/prepare-pages.mjs
          node scripts/migration/check-migration.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - uses: actions/deploy-pages@v4
        id: deployment
